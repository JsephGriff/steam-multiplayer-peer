name: Build GDExtension
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      steamworks_sdk_branch:
        description: 'Steamworks SDK branch (flibitijibibo/steamworks-sdk):'
        required: true
        type: string
        default: '1.62'

env:
  LIBNAME: steam-multiplayer-peer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A build is made for every possible combination of parameters
        # You can add or remove entries from the arrays of each parameter to custimize which builds you want to run
        # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: windows, arch: x86_64, os: windows-latest },
            # { platform: windows, arch: x86_32, os: windows-latest },
            { platform: macos, arch: universal, os: macos-latest },
            # { platform: android, arch: arm64, os: ubuntu-22.04 },
            # { platform: android, arch: arm32, os: ubuntu-22.04 },
            # { platform: android, arch: x86_64, os: ubuntu-22.04 },
            # { platform: android, arch: x86_32, os: ubuntu-22.04 },
            # { platform: ios, arch: arm64, os: macos-latest },
            # { platform: web, arch: wasm32, os: ubuntu-22.04 }
          ]
        target-type: [template_debug, template_release]
        float-precision: [single, double]

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout Steamworks SDK
        uses: actions/checkout@v4
        with:
          repository: flibitijibibo/steamworks-sdk
          ref: ${{ inputs.steamworks_sdk_branch || '1.62' }}
          path: steamworks

      - name: Copy Steamworks
        shell: bash
        run: |
          mkdir -p steam-multiplayer-peer/sdk/public
          cp -r steamworks/steam steam-multiplayer-peer/sdk/public/steam
          cp -r steamworks/redistributable_bin steam-multiplayer-peer/sdk/redistributable_bin

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # Build GDExtension (with caches)

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # Clean up compilation files
      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      # Upload the build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-multiplayer-peer-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/bin/**

  # Merges all the build artifacts together into a single godot-cpp-template artifact.
  # If you comment out this step, all the builds will be uploaded individually.
  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: steam-multiplayer-peer
          pattern: steam-multiplayer-peer-*
          delete-merged: true

  # On version tags, assemble a drop-in Godot addon zip and publish a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: steam-multiplayer-peer
          path: dist

      - name: Checkout Steamworks SDK (runtime libraries)
        uses: actions/checkout@v4
        with:
          repository: flibitijibibo/steamworks-sdk
          ref: ${{ inputs.steamworks_sdk_branch || '1.62' }}
          path: steamworks

      - name: Assemble addon
        shell: bash
        run: |
          mkdir -p addon/windows addon/linux addon/macos
          cp dist/*windows* addon/windows/
          cp dist/*linux* addon/linux/
          cp dist/*macos* addon/macos/
          cp steamworks/redistributable_bin/win64/steam_api64.dll addon/windows/
          cp steamworks/redistributable_bin/linux64/libsteam_api.so addon/linux/
          cp steamworks/redistributable_bin/osx/libsteam_api.dylib addon/macos/
          cp steam-multiplayer-peer.gdextension README.md LICENSE addon/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r steam-multiplayer-peer-${{ github.ref_name }}.zip addon
          gh release create "$GITHUB_REF_NAME" "steam-multiplayer-peer-${{ github.ref_name }}.zip" --generate-notes --title "$GITHUB_REF_NAME"
